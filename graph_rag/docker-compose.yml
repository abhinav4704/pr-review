services:
  neo4j:
    image: neo4j:5
    container_name: cbrain-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-testpassword}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-testpassword} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    image: graph-rag-indexer:latest
    container_name: graph-rag-indexer
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      # The repo to index. Set REPO_PATH per machine (host path):
      #   macOS/Linux: REPO_PATH=../sail        Windows: REPO_PATH=D:/Downloads/sail
      - ${REPO_PATH:-./samples}:/work/repo:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-testpassword}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      REPO_NAME: ${REPO_NAME:-sail}
    restart: "no"

volumes:
  neo4j_data:

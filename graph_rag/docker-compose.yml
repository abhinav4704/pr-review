services:
  neo4j:
    image: neo4j:5
    container_name: cbrain-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-testpassword}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-testpassword} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  indexer:
    image: ${NODE_IMAGE:-node:20-bullseye}
    container_name: graph-rag-indexer
    depends_on:
      neo4j:
        condition: service_healthy
    working_dir: /work/graph_rag
    volumes:
      - ./:/work/graph_rag
      - D:/Downloads/sail/packages:/work/packages:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-testpassword}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      REPO_NAME: ${REPO_NAME:-sail}
      SCIP_PYTHON_VERSION: ${SCIP_PYTHON_VERSION:-latest}
    command: >
      bash -lc "
      apt-get update &&
      apt-get install -y --no-install-recommends python3 python3-venv python3-pip ca-certificates &&
      python3 -m venv /tmp/graph_rag_venv &&
      . /tmp/graph_rag_venv/bin/activate &&
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      npm install --prefix scip_tooling @sourcegraph/scip-python@$${SCIP_PYTHON_VERSION} &&
      export SCIP_PYTHON_BIN=/work/graph_rag/scip_tooling/node_modules/.bin/scip-python &&
      python -m graph_rag.cli index /work/packages --repo $${REPO_NAME}
      "
    restart: "no"

volumes:
  neo4j_data:
